# Local or single-server setup: the API and MongoDB.
# Copy backend/.env.example to backend/.env and set JWT_SECRET and DATA_ENCRYPTION_KEY first.
#   docker compose up --build
services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/blacksquad
      PORT: "5000"
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
