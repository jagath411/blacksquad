name: Android preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent_dev

jobs:
  build:
    name: Build Expo preview APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Configure mobile production environment
        working-directory: frontend
        run: |
          printf '%s\n' \
            'EXPO_PUBLIC_API_BASE_URL=https://comply-plywood-crept.ngrok-free.dev/api' \
            'EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=892541607147-lsvgfd2bnc14bedn150a0jflmv30gh1m.apps.googleusercontent.com' \
            'EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=892541607147-no1cnphat1e4ksb72urft5l2991afn6l.apps.googleusercontent.com' \
            'EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=892541607147-mrse0ua8umjjk9rdc588chb3qtauph41.apps.googleusercontent.com' \
            > .env

      - name: Validate Expo project
        working-directory: frontend
        continue-on-error: true
        run: npx expo-doctor

      - name: Verify Expo authentication
        working-directory: frontend
        run: npx --yes eas-cli@latest whoami

      - name: Build preview APK with EAS
        working-directory: frontend
        run: npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --wait

      - name: Publish APK download URL
        working-directory: frontend
        run: |
          npx --yes eas-cli@latest build:list --platform android --limit 1 --json > /tmp/latest-build.json
          node - <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/latest-build.json', 'utf8'));
          const build = Array.isArray(raw) ? raw[0] : (raw.builds || [])[0];
          const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl || build?.applicationArchiveUrl;
          if (!url) throw new Error('EAS completed but did not return an APK URL');
          fs.writeFileSync('/tmp/latest-apk-url.txt', url);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Android preview APK\n\n[Download APK](${url})\n`);
          console.log(`APK URL: ${url}`);
          NODE
          curl --fail --location "$(cat /tmp/latest-apk-url.txt)" --output /tmp/blacksquad-preview.apk
          keytool -printcert -jarfile /tmp/blacksquad-preview.apk > /tmp/blacksquad-cert.txt
          sha1=$(awk -F': ' '/SHA1:/ {print $2}' /tmp/blacksquad-cert.txt)
          sha256=$(awk -F': ' '/SHA256:/ {print $2}' /tmp/blacksquad-cert.txt)
          if [ -z "$sha1" ]; then echo 'Could not extract APK SHA-1 certificate' >&2; cat /tmp/blacksquad-cert.txt; exit 1; fi
          {
            echo
            echo '### Android OAuth certificate'
            echo
            echo "Package: \`com.blacksquad.mobile\`"
            echo "SHA-1: \`$sha1\`"
            echo "SHA-256: \`$sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"
