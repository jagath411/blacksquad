name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent_dev

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Configure mobile environment
        working-directory: frontend
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
        run: |
          test -n "$EXPO_PUBLIC_API_BASE_URL" || { echo "Set the EXPO_PUBLIC_API_BASE_URL repository variable"; exit 1; }
          env | grep '^EXPO_PUBLIC_' > .env

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Ensure Android Assets and Vector Fonts
        working-directory: frontend
        run: |
          mkdir -p android/app/src/main/assets/fonts
          cp node_modules/@expo/vector-icons/build/vendor/react-native-vector-icons/Fonts/*.ttf android/app/src/main/assets/fonts/ 2>/dev/null || true
          echo "Bundled $(ls -1 android/app/src/main/assets/fonts/*.ttf | wc -l) vector font files."

      - name: Restore upload key
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" || { echo "Set the ANDROID_UPLOAD_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"

      - name: Build Android Release APK with Gradle
        working-directory: frontend/android
        env:
          BLACKSQUAD_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.keystore
          BLACKSQUAD_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          BLACKSQUAD_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          BLACKSQUAD_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK Signatures (v1 and v2)
        working-directory: frontend/android
        run: |
          echo "=== Running apksigner verification on release APK ==="
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackSquad-Release-APK
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/agent_dev')
        with:
          tag_name: pilot-apk-v${{ github.run_number }}
          name: BlackSquad Pilot Release v${{ github.run_number }}
          body: |
            BlackSquad pilot APK built from ${{ github.sha }}.
          files: frontend/android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
