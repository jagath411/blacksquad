name: Android preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent_dev

jobs:
  build:
    name: Build Expo preview APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EXPO_ACCESS_TOKEN || secrets.EAS_TOKEN }}
      EAS_NO_VCS: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Configure mobile production environment
        working-directory: frontend
        run: |
          printf '%s\n' \
            'EXPO_PUBLIC_API_BASE_URL=https://comply-plywood-crept.ngrok-free.dev/api' \
            'EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=892541607147-lsvgfd2bnc14bedn150a0jflmv30gh1m.apps.googleusercontent.com' \
            'EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=892541607147-no1cnphat1e4ksb72urft5l2991afn6l.apps.googleusercontent.com' \
            'EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=892541607147-mrse0ua8umjjk9rdc588chb3qtauph41.apps.googleusercontent.com' \
            > .env

      - name: Validate Expo project
        working-directory: frontend
        continue-on-error: true
        run: npx expo-doctor

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Inspect EAS environment
        working-directory: frontend
        run: |
          {
            echo "### EAS Diagnostics"
            echo "- EXPO_TOKEN length: ${#EXPO_TOKEN}"
            echo "- EAS CLI version: $(eas --version)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is empty! Please check your GitHub repository secrets."
            echo "❌ **ERROR**: EXPO_TOKEN secret is empty in GitHub repository settings!" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Logged in as:" >> "$GITHUB_STEP_SUMMARY"
          eas whoami >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      - name: Build preview APK with EAS
        working-directory: frontend
        run: |
          echo "Launching EAS Build..."
          eas build --platform android --profile preview --non-interactive --wait > /tmp/eas-build.log 2>&1 || {
            status=$?
            echo "### ❌ EAS Build Failed (Exit Code: $status)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/eas-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/eas-build.log
            exit $status
          }
          echo "### ✅ EAS Build Succeeded" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/eas-build.log

      - name: Publish APK download URL
        working-directory: frontend
        if: always()
        run: |
          eas build:list --platform android --limit 1 --json > /tmp/latest-build.json || true
          if [ -s /tmp/latest-build.json ]; then
            node - <<'NODE'
            const fs = require('fs');
            try {
              const raw = JSON.parse(fs.readFileSync('/tmp/latest-build.json', 'utf8'));
              const build = Array.isArray(raw) ? raw[0] : (raw.builds || [])[0];
              const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl || build?.applicationArchiveUrl;
              if (url) {
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Android preview APK\n\n🎉 **[Download BlackSquad Preview APK](${url})**\n\n- Build ID: \`${build.id}\`\n- Status: \`${build.status}\`\n- Created: \`${build.createdAt}\`\n`);
                console.log(`APK URL: ${url}`);
              } else {
                console.log('No build URL found in EAS JSON:', JSON.stringify(build, null, 2));
              }
            } catch (e) {
              console.error(e);
            }
            NODE
          fi
