name: Android preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent_dev

jobs:
  build:
    name: Build Expo preview APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Configure mobile production environment
        working-directory: frontend
        run: |
          printf '%s\n' \
            'EXPO_PUBLIC_API_BASE_URL=https://comply-plywood-crept.ngrok-free.dev/api' \
            'EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=892541607147-lsvgfd2bnc14bedn150a0jflmv30gh1m.apps.googleusercontent.com' \
            'EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=892541607147-no1cnphat1e4ksb72urft5l2991afn6l.apps.googleusercontent.com' \
            'EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=892541607147-mrse0ua8umjjk9rdc588chb3qtauph41.apps.googleusercontent.com' \
            > .env

      - name: Validate Expo project
        working-directory: frontend
        continue-on-error: true
        run: npx expo-doctor

      - name: Verify Expo authentication
        working-directory: frontend
        run: npx eas whoami

      - name: Build preview APK with EAS
        working-directory: frontend
        run: npx eas build --platform android --profile preview --non-interactive --wait
