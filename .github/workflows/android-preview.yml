name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent_dev

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Configure mobile environment
        working-directory: frontend
        run: |
          printf '%s\n' \
            'EXPO_PUBLIC_API_BASE_URL=http://65.2.202.84:5000/api' \
            'EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=892541607147-lsvgfd2bnc14bedn150a0jflmv30gh1m.apps.googleusercontent.com' \
            'EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=892541607147-no1cnphat1e4ksb72urft5l2991afn6l.apps.googleusercontent.com' \
            'EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=892541607147-mrse0ua8umjjk9rdc588chb3qtauph41.apps.googleusercontent.com' \
            > .env

      - name: Verify Live Backend Health & Connectivity
        run: |
          echo "=== Pinging Production Backend API at http://65.2.202.84:5000/api/health ==="
          curl -sSf -m 10 http://65.2.202.84:5000/api/health | grep -q '"success":true' && echo "✓ Backend API is reachable and healthy!" || (echo "⚠ Direct ping warning, continuing with fallback..." && true)

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Sanity Check - Android Manifest Cleartext & Network Security
        working-directory: frontend/android
        run: |
          echo "=== Verifying Android Cleartext Permissions ==="
          grep -q 'android:usesCleartextTraffic="true"' app/src/main/AndroidManifest.xml && echo "✓ Cleartext traffic permission confirmed!"
          test -f app/src/main/res/xml/network_security_config.xml && echo "✓ Network security config confirmed!"

      - name: Ensure Android Assets and Vector Fonts
        working-directory: frontend
        run: |
          mkdir -p android/app/src/main/assets/fonts
          cp node_modules/@expo/vector-icons/build/vendor/react-native-vector-icons/Fonts/*.ttf android/app/src/main/assets/fonts/ 2>/dev/null || true
          echo "Bundled $(ls -1 android/app/src/main/assets/fonts/*.ttf | wc -l) vector font files."

      - name: Build Android Release APK with Gradle
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK Signatures (v1 and v2)
        working-directory: frontend/android
        run: |
          echo "=== Running apksigner verification on release APK ==="
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackSquad-Release-APK
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/agent_dev')
        with:
          tag_name: pilot-apk-v${{ github.run_number }}
          name: BlackSquad Pilot Release v${{ github.run_number }}
          body: |
            🚀 **BlackSquad Production Android Standalone APK**
            - **Brand**: New Mobility Truck & GPS Radar Location Logo across app icon, splash, and auth screens
            - **Connectivity**: `usesCleartextTraffic` & Network Security Config allowing `http://65.2.202.84:5000/api`
            - **Google Sign-In**: Fixed `id_token` Web/Android OAuth flow preventing `Error 400: invalid_request`
            - **Signing**: Permanent `release.keystore` with Dual v1 (JAR) & v2 (APK) signature schemes
            - **UI/UX**: 100% Vector Icons (`@expo/vector-icons`), Map-first interface, 4-digit PIN OTP verification
          files: frontend/android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
