name: Publish latest APK link

on:
  push:
    branches:
      - apk-link
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read latest EAS APK URL
        run: |
          npx --yes eas-cli@latest build:list --platform android --limit 1 --json > /tmp/latest-build.json
          node - <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/latest-build.json', 'utf8'));
          const build = Array.isArray(raw) ? raw[0] : (raw.builds || [])[0];
          const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl || build?.applicationArchiveUrl;
          if (!url) throw new Error('No completed Android APK found');
          fs.writeFileSync('latest-apk-url.txt', `${url}\n`);
          NODE
      - name: Commit public link
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add latest-apk-url.txt
          git diff --cached --quiet || git commit -m 'ci: update latest APK link [skip ci]'
          git push
